services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyflip
      POSTGRES_USER: skyflip
      POSTGRES_PASSWORD: skyflip
    ports:
      - "5432:5432"
    volumes:
      - skyflip-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyflip -d skyflip"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - skyflip-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: infrastructure/python.Dockerfile
    working_dir: /workspace/apps/api
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skyflip:skyflip@postgres:5432/skyflip
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/python.Dockerfile
    working_dir: /workspace/apps/api
    command: python /workspace/apps/worker/worker.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skyflip:skyflip@postgres:5432/skyflip
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  skyflip-postgres:
  skyflip-redis:

